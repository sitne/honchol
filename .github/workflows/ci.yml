name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -o /tmp/honchol .

  sdk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build server
        working-directory: server
        run: go build -trimpath -o honchol .
      - name: Start server
        working-directory: server
        run: |
          nohup ./honchol serve -addr 127.0.0.1:8793 -db /tmp/smoke.db >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8793/health >/dev/null; then
              echo "server ready"; exit 0
            fi
            sleep 0.5
          done
          echo "server did not become ready"; cat /tmp/serve.log; exit 1
      - name: SDK smoke test
        run: |
          python -m pip install --quiet honcho-ai
          cd server && python smoke_sdk.py http://127.0.0.1:8793
